<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITO ANIME - Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --dark: #0a0a0c;
            --card-bg: #16181d;
            --text: #ffffff;
            --gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 10, 12, 0.9);
            --rgb-gradient: linear-gradient(45deg, #ff4757, #7158e2, #00d2d3, #ff4757);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--text); overflow-x: hidden; padding-bottom: 100px; }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal { opacity: 0; }
        .reveal.active { animation: fadeInUp 0.8s ease forwards; }

        @keyframes rgb-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- NAVBAR --- */
        .navbar { 
            background: var(--glass); height: 80px; display: flex; 
            align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .nav-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary); }

        /* --- BANNER RGB & ARROWS --- */
        .hero-wrapper { 
            position: relative; padding: 4px; border-radius: 25px; margin-top: 100px; 
            background: var(--rgb-gradient); background-size: 400% 400%; animation: rgb-border 8s linear infinite;
        }
        .hero { height: 450px; position: relative; overflow: hidden; border-radius: 22px; background: #000; display: flex; align-items: center; }
        .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); transition: 1s ease; }
        
        .hero-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: var(--rgb-gradient); background-size: 300% 300%; animation: rgb-border 4s linear infinite;
            color: white; cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .hero-arrow:hover { transform: translateY(-50%) scale(1.1); filter: brightness(1.2); }
        .prev-arr { left: 20px; }
        .next-arr { right: 20px; }

        /* --- SEARCH SYSTEM --- */
        #searchBoxContainer {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 600px; background: var(--card-bg); border: 1px solid var(--primary);
            border-radius: 15px; z-index: 1500; display: none; max-height: 400px; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        #searchBoxContainer.active { display: block; animation: fadeInUp 0.3s ease; }
        .search-item { display: flex; gap: 15px; padding: 12px; border-bottom: 1px solid var(--border); transition: 0.3s; }
        .search-item:hover { background: rgba(255,255,255,0.05); }

        /* --- MOBILE SEARCH OVERLAY (Top) --- */
        #mobileSearchTop {
            position: fixed; top: -100px; left: 0; width: 100%; height: 80px;
            background: var(--dark); z-index: 2000; display: flex; align-items: center;
            padding: 0 20px; transition: 0.4s; border-bottom: 2px solid var(--primary);
        }
        #mobileSearchTop.active { top: 0; }
        .m-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid var(--border); background: #1a1a1e; color: white; outline: none; }

        /* --- GRID & CARDS --- */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .anime-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); transition: 0.4s; position: relative; }
        .anime-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(255,71,87,0.2); }
        .badge-rate { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; font-size: 11px; color: #ffc107; font-weight: 800; }

        @media (max-width: 1024px) {
            .nav-right-side { display: none; }
            .nav-content { justify-content: center; }
            .mobile-nav { display: flex; position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--border); z-index: 1000; justify-content: space-around; align-items: center; }
            .mobile-nav a { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--gray); font-weight: 700; text-decoration: none; }
            .mobile-nav a.active { color: var(--primary); }
        }
    </style>
</head>
<body>

    <div id="mobileSearchTop">
        <input type="text" id="mSearchInput" class="m-input" placeholder="Nhập tên phim muốn tìm...">
        <i class="fa-solid fa-xmark" style="margin-left: 15px; color: var(--primary); font-size: 24px;" onclick="toggleSearch(false)"></i>
    </div>

    <div id="searchBoxContainer">
        <div id="searchResults"></div>
    </div>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo reveal" onclick="location.href='index.html'">
                <i class="fa-solid fa-angles-right" style="color:var(--primary)"></i>
                KITO <span>ANIME</span>
                <i class="fa-solid fa-angles-left" style="color:var(--primary)"></i>
            </div>
            
            <div class="nav-right-side reveal">
                <input type="text" id="pcSearchInput" placeholder="Tìm kiếm anime..." style="background:#1a1a1e; border:1px solid var(--border); color:white; border-radius:20px; padding:8px 20px; outline:none; width: 250px;">
                <div id="userZonePC" style="margin-left: 20px;"></div>
            </div>
        </div>
    </header>

    <main style="max-width:1400px; margin:0 auto; padding:20px;">
        <div class="hero-wrapper reveal">
            <section class="hero">
                <div id="heroBg"></div>
                <div style="position:relative; z-index:10; padding:40px;">
                    <h1 id="hTitle" style="font-size: clamp(24px, 5vw, 40px); font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">...</h1>
                    <button id="hBtn" style="margin-top:20px; background:var(--primary); color:white; border:none; padding:12px 35px; border-radius:10px; font-weight:800; cursor:pointer;">XEM NGAY</button>
                </div>
                <button class="hero-arrow prev-arr" onclick="changeHero(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="hero-arrow next-arr" onclick="changeHero(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </section>
        </div>

        <section class="reveal">
            <h2 style="margin:40px 0 20px; border-left:4px solid var(--primary); padding-left:15px;">SẮP PHÁT HÀNH</h2>
            <div class="anime-grid" id="comingGrid"></div>
        </section>

        <section class="reveal">
            <h2 style="margin:40px 0 20px; border-left:4px solid var(--primary); padding-left:15px;">MỚI CẬP NHẬT</h2>
            <div class="anime-grid" id="updateGrid"></div>
        </section>

        <section class="reveal">
            <h2 style="margin:40px 0 20px; border-left:4px solid var(--primary); padding-left:15px;">ĐỀ XUẤT CHO BẠN</h2>
            <div class="anime-grid" id="recGrid"></div>
        </section>
    </main>

    <nav class="mobile-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="javascript:void(0)" onclick="toggleSearch(true)"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></a>
        <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử</span></a>
        <a href="javascript:void(0)" id="mobileUserBtn"><i class="fa-solid fa-user"></i><span>Cá nhân</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBP9ZnwzQrrRY5JNy1DANm3boaWgvhoS_w", authDomain: "kito-anime-vn.firebaseapp.com", projectId: "kito-anime-vn", storageBucket: "kito-anime-vn.firebasestorage.app", appId: "1:287480619398:web:f40d137345407f27874c07" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allMovies = [];
        let bannerMovies = [];
        let currentHero = 0;

        // --- SEARCH ENGINE ---
        function setupSearch(inputId) {
            document.getElementById(inputId).addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const container = document.getElementById('searchBoxContainer');
                const results = document.getElementById('searchResults');
                
                if (query === "") {
                    container.classList.remove('active');
                    return;
                }

                const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
                
                if (filtered.length > 0) {
                    container.classList.add('active');
                    results.innerHTML = filtered.map(m => `
                        <a href="watch.html?id=${m.id}" class="search-item">
                            <img src="${m.image}" style="width:50px; height:70px; object-fit:cover; border-radius:5px">
                            <div>
                                <div style="font-weight:700; font-size:14px; color:white">${m.title}</div>
                                <div style="font-size:12px; color:var(--gray)">Xem ngay</div>
                            </div>
                        </a>
                    `).join('');
                } else {
                    results.innerHTML = '<div style="padding:20px; text-align:center; color:var(--gray)">Không tìm thấy phim này...</div>';
                    container.classList.add('active');
                }
            });
        }

        window.toggleSearch = (show) => {
            document.getElementById('mobileSearchTop').classList.toggle('active', show);
            if (!show) document.getElementById('searchBoxContainer').classList.remove('active');
        };

        // --- ANIMATION OBSERVER ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });

        // --- LOAD DATA ---
        async function init() {
            const res = await fetch('./api.json');
            const data = await res.json();
            
            // Gộp tất cả phim để tìm kiếm
            allMovies = [...data.comingSoon, ...data.updated, ...data.recommended];
            bannerMovies = data.updated.slice(0, 5);

            render(data.comingSoon, 'comingGrid');
            render(data.updated, 'updateGrid');
            render(data.recommended, 'recGrid');
            updateHero();

            setupSearch('pcSearchInput');
            setupSearch('mSearchInput');

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        async function getStats(id) {
            const snap = await getDoc(doc(db, "movie_stats", String(id)));
            if(snap.exists()) {
                const d = snap.data();
                const r = d.rateCount > 0 ? (d.rating / d.rateCount).toFixed(1) : "10.0";
                if(document.getElementById(`r-${id}`)) document.getElementById(`r-${id}`).innerText = r;
                if(document.getElementById(`v-${id}`)) document.getElementById(`v-${id}`).innerText = d.views || 0;
            }
        }

        function render(list, gridId) {
            document.getElementById(gridId).innerHTML = list.map(m => {
                getStats(m.id);
                return `
                <a href="watch.html?id=${m.id}" class="anime-card">
                    <div class="card-img">
                        <img src="${m.image}" loading="lazy">
                        <div class="badge-rate"><i class="fa-solid fa-star"></i> <span id="r-${m.id}">10.0</span></div>
                        <div style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.8); padding:4px 8px; border-radius:6px; font-size:10px;"><i class="fa-solid fa-eye"></i> <span id="v-${m.id}">0</span></div>
                    </div>
                    <div style="padding:12px"><h3 style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.title}</h3></div>
                </a>`;
            }).join('');
        }

        window.changeHero = (dir) => {
            currentHero = (currentHero + dir + bannerMovies.length) % bannerMovies.length;
            updateHero();
        }

        function updateHero() {
            const m = bannerMovies[currentHero];
            document.getElementById('heroBg').style.background = `url(${m.image_banner}) center/cover no-repeat`;
            document.getElementById('hTitle').innerText = m.title;
            document.getElementById('hBtn').onclick = () => location.href = `watch.html?id=${m.id}`;
        }

        init();
    </script>
</body>
</html>

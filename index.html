<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITO ANIME - Trang Chủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --dark: #0a0a0c;
            --card-bg: #16181d;
            --text: #ffffff;
            --gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 10, 12, 0.9);
            --rgb: linear-gradient(45deg, #ff4757, #7158e2, #00d2d3, #ff4757);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--text); overflow-x: hidden; padding-bottom: 100px; }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { opacity: 0; }
        .reveal.active { animation: fadeInUp 0.8s ease forwards; }

        /* --- NAVBAR --- */
        .navbar { 
            background: var(--glass); height: 80px; display: flex; 
            align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .nav-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary); }

        /* --- SEARCH BOX --- */
        .search-results-box {
            position: absolute; top: 70px; right: 0; width: 350px; 
            background: var(--card-bg); border: 1px solid var(--primary);
            border-radius: 12px; display: none; max-height: 450px; overflow-y: auto; z-index: 2000;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .search-results-box.active { display: block; }
        .s-item { display: flex; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border); text-decoration: none; color: white; }
        .s-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 5px; }

        /* --- BANNER RGB --- */
        .hero-wrapper { 
            position: relative; padding: 3px; border-radius: 25px; margin-top: 100px; 
            background: var(--rgb); background-size: 400% 400%; animation: rgb-flow 8s linear infinite;
        }
        @keyframes rgb-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .hero { height: 450px; position: relative; overflow: hidden; border-radius: 22px; background: #000; display: flex; align-items: center; }
        .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); transition: 0.8s ease-in-out; }
        
        .hero-content { position: relative; z-index: 5; padding: 40px; max-width: 600px; }
        .h-description { 
            color: #d1d5db; font-size: 14px; margin-top: 15px; line-height: 1.6;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        .h-arrow {
            position: absolute; width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary);
            background: rgba(0,0,0,0.5); color: white; cursor: pointer; z-index: 10; transition: 0.3s;
        }
        .h-arrow:hover { background: var(--primary); transform: scale(1.1); }

        /* --- ANIME GRID --- */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .anime-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; text-decoration: none; color: white; }
        .anime-card:hover { transform: translateY(-8px); border-color: var(--primary); }
        
        .card-img { width: 100%; aspect-ratio: 2 / 3; position: relative; overflow: hidden; background: #1a1a1e; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-rate { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 3px 7px; border-radius: 5px; font-size: 11px; color: #ffc107; font-weight: 800; display: flex; align-items: center; gap: 4px; }

        /* --- PROFILE MODAL --- */
        .modal-profile { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(5px); }
        .modal-profile.active { display: flex; }
        .p-card { background: var(--card-bg); width: 320px; padding: 30px; border-radius: 25px; border: 1px solid var(--primary); text-align: center; }
        .p-avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; object-fit: cover; }

        @media (max-width: 1024px) {
            .nav-right-side { display: none; }
            .nav-content { justify-content: center; }
            .hero { height: 350px; }
            .mobile-nav { display: flex; position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--glass); z-index: 1000; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
            .mobile-nav a { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--gray); text-decoration: none; }
            .mobile-nav a.active { color: var(--primary); }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo reveal" onclick="location.href='index.html'">
                <i class="fa-solid fa-angles-right" style="color:var(--primary)"></i>
                KITO <span>ANIME</span>
                <i class="fa-solid fa-angles-left" style="color:var(--primary)"></i>
            </div>
            
            <div class="nav-right-side reveal" style="position:relative">
                <input type="text" id="pcSearch" placeholder="Tìm kiếm anime..." style="background:#1a1a1e; border:1px solid var(--border); color:white; border-radius:20px; padding:7px 20px; outline:none; width:250px">
                <div id="pcSearchRes" class="search-results-box"></div>
                <div id="userPC" style="margin-left:20px"></div>
            </div>
        </div>
    </header>

    <main style="max-width:1400px; margin:0 auto; padding:20px;">
        <div class="hero-wrapper reveal">
            <section class="hero">
                <div id="hBg" class="hero-bg"></div>
                <button class="h-arrow" style="left:15px" onclick="moveH(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                
                <div class="hero-content">
                    <h1 id="hTitle" style="font-size: clamp(24px, 5vw, 38px); font-weight: 900; color: white;">...</h1>
                    <p id="hDesc" class="h-description">...</p>
                    <button id="hBtn" style="margin-top:25px; background:var(--primary); color:white; border:none; padding:12px 35px; border-radius:10px; cursor:pointer; font-weight:800; text-transform: uppercase;">Xem ngay</button>
                </div>

                <button class="h-arrow" style="right:15px" onclick="moveH(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </section>
        </div>

        <section class="reveal">
            <h2 style="margin:40px 0 20px; border-left:4px solid var(--primary); padding-left:15px">SẮP PHÁT HÀNH</h2>
            <div class="anime-grid" id="gridComing"></div>
        </section>

        <section class="reveal">
            <h2 style="margin:40px 0 20px; border-left:4px solid var(--primary); padding-left:15px">MỚI CẬP NHẬT</h2>
            <div class="anime-grid" id="gridUpdate"></div>
        </section>

        <section class="reveal">
            <h2 style="margin:40px 0 20px; border-left:4px solid var(--primary); padding-left:15px">ĐỀ XUẤT CHO BẠN</h2>
            <div class="anime-grid" id="gridRec"></div>
        </section>
    </main>

    <nav class="mobile-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="javascript:void(0)" onclick="openMobileSearch()"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></a>
        <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử</span></a>
        <a href="javascript:void(0)" id="mobileUser"><i class="fa-solid fa-user"></i><span>Cá nhân</span></a>
    </nav>

    <div class="modal-profile" id="pModal">
        <div class="p-card">
            <img src="" id="pAva" class="p-avatar">
            <h2 id="pName" style="color:white; margin-bottom:5px">...</h2>
            <p id="pEmail" style="color:var(--gray); font-size:12px; margin-bottom:25px"></p>
            <button id="btnLogout" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:800; cursor:pointer">ĐĂNG XUẤT</button>
            <p onclick="closeProfile()" style="margin-top:15px; color:var(--gray); cursor:pointer; font-size:13px">Đóng</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBP9ZnwzQrrRY5JNy1DANm3boaWgvhoS_w", authDomain: "kito-anime-vn.firebaseapp.com", projectId: "kito-anime-vn", storageBucket: "kito-anime-vn.firebasestorage.app", appId: "1:287480619398:web:f40d137345407f27874c07" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allMovies = [];
        let heroList = [];
        let heroIdx = 0;

        // --- FETCH STATS (FIX RATING LOGIC) ---
        async function fetchStats(id) {
            try {
                const snap = await getDoc(doc(db, "movie_stats", String(id)));
                if(snap.exists()){
                    const d = snap.data();
                    // Tính trung bình: Tổng điểm / Số lượt đánh giá
                    const rate = d.rateCount > 0 ? (d.rating / d.rateCount).toFixed(1) : "10.0";
                    const rateEl = document.getElementById(`r-${id}`);
                    if(rateEl) rateEl.innerText = rate;
                }
            } catch (err) { console.error("Lỗi lấy rating:", err); }
        }

        // --- RENDER ---
        function render(list, id) {
            document.getElementById(id).innerHTML = list.map(m => {
                fetchStats(m.id);
                return `
                <a href="watch.html?id=${m.id}" class="anime-card">
                    <div class="card-img">
                        <img src="${m.image}" loading="lazy">
                        <div class="badge-rate"><i class="fa-solid fa-star"></i> <span id="r-${m.id}">10.0</span></div>
                    </div>
                    <div style="padding:10px">
                        <h3 style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.title}</h3>
                    </div>
                </a>`;
            }).join('');
        }

        // --- BANNER LOGIC ---
        window.moveH = (d) => { heroIdx = (heroIdx + d + heroList.length) % heroList.length; updateHero(); };
        function updateHero() {
            const m = heroList[heroIdx];
            if(!m) return;
            document.getElementById('hBg').style.backgroundImage = `url(${m.image_banner})`;
            document.getElementById('hBg').style.backgroundSize = "cover";
            document.getElementById('hTitle').innerText = m.title;
            // Hiển thị description từ JSON
            document.getElementById('hDesc').innerText = m.description || "Chào mừng bạn đến với thế giới Anime đỉnh cao tại KITO ANIME.";
            document.getElementById('hBtn').onclick = () => location.href = `watch.html?id=${m.id}`;
        }

        // --- INIT ---
        async function init() {
            const res = await fetch('./api.json');
            const data = await res.json();
            allMovies = [...data.comingSoon, ...data.updated, ...data.recommended];
            heroList = data.updated.slice(0, 5);
            
            render(data.comingSoon, 'gridComing');
            render(data.updated, 'gridUpdate');
            render(data.recommended, 'gridRec');
            updateHero();

            // Intersection Observer for Animation
            const obs = new IntersectionObserver((es) => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('active') }));
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }

        // --- AUTH & PROFILE ---
        onAuthStateChanged(auth, (user) => {
            const pcZone = document.getElementById('userPC');
            const mobileBtn = document.getElementById('mobileUser');
            if(user) {
                const ava = user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email}`;
                pcZone.innerHTML = `<img src="${ava}" onclick="openProfile()" style="width:35px; height:35px; border-radius:50%; border:2px solid var(--primary); cursor:pointer; object-fit:cover;">`;
                document.getElementById('pAva').src = ava;
                document.getElementById('pName').innerText = user.displayName || "Thành viên Kito";
                document.getElementById('pEmail').innerText = user.email;
                mobileBtn.onclick = () => openProfile();
            } else {
                pcZone.innerHTML = `<button onclick="location.href='auth.html'" style="background:var(--primary); color:white; border:none; padding:7px 15px; border-radius:20px; cursor:pointer; font-weight:800">LOGIN</button>`;
                mobileBtn.onclick = () => location.href = 'auth.html';
            }
        });
        window.openProfile = () => document.getElementById('pModal').classList.add('active');
        window.closeProfile = () => document.getElementById('pModal').classList.remove('active');
        document.getElementById('btnLogout').onclick = () => signOut(auth).then(() => location.reload());

        init();
    </script>
</body>
</html>

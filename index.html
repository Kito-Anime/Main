<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITO ANIME - Trang Chủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --dark: #0a0a0c;
            --card-bg: #16181d;
            --text: #ffffff;
            --gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 10, 12, 0.9);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--text); overflow-x: hidden; padding-bottom: 100px; }
        
        /* --- NAVBAR --- */
        .navbar { 
            background: var(--glass); height: 80px; display: flex; 
            align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .nav-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: relative; }
        
        /* Logo Styling */
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary); }
        .logo-arrow { color: var(--primary); font-size: 18px; animation: pulse 1.5s infinite; text-shadow: 0 0 10px var(--primary); }
        @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        /* Search Desktop */
        .pc-search-box { background: #1a1a1e; border: 1px solid var(--border); color: white; border-radius: 20px; padding: 6px 15px; outline: none; width: 200px; transition: 0.3s; }
        .pc-search-box:focus { border-color: var(--primary); width: 250px; }

        /* Mobile Search Overlay */
        #mobileSearchOverlay {
            position: fixed; top: -100px; left: 0; width: 100%; height: 80px;
            background: var(--dark); z-index: 2000; display: flex; align-items: center;
            justify-content: center; padding: 0 20px; transition: 0.4s; border-bottom: 1px solid var(--primary);
        }
        #mobileSearchOverlay.active { top: 0; }
        .m-search-box { width: 100%; max-width: 500px; position: relative; display: flex; align-items: center; }
        .m-search-box input { width: 100%; padding: 12px 45px 12px 20px; border-radius: 25px; border: 1px solid var(--border); background: #1a1a1e; color: white; outline: none; }
        .m-search-box i.close-search { position: absolute; right: 15px; color: var(--primary); font-size: 20px; cursor: pointer; }

        /* --- CARDS & STATS --- */
        .section-title { font-size: 20px; font-weight: 900; margin: 40px 0 20px; border-left: 4px solid var(--primary); padding-left: 15px; text-transform: uppercase; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .anime-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; position: relative; display: block; }
        .anime-card:hover { transform: translateY(-8px); border-color: var(--primary); }
        .card-img { height: 260px; position: relative; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rate { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #ffc107; backdrop-filter: blur(4px); }
        .badge-views { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #fff; backdrop-filter: blur(4px); }

        /* --- PROFILE MODAL --- */
        .user-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .user-modal-overlay.active { display: flex; }
        .profile-card { background: var(--card-bg); width: 320px; padding: 40px 20px; border-radius: 30px; border: 1px solid var(--border); text-align: center; position: relative; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; object-fit: cover; }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 1024px) {
            .nav-right-side { display: none; } /* Ẩn login/avatar/search trên header mobile */
            .nav-content { justify-content: center; } /* Đưa logo ra giữa */
            .logo { font-size: 22px; }
            .hero { height: 320px; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .mobile-nav { display: flex; position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--border); z-index: 1000; justify-content: space-around; align-items: center; }
            .mobile-nav a { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--gray); font-weight: 700; gap: 4px; text-decoration: none; }
            .mobile-nav a.active { color: var(--primary); }
        }

        @media (min-width: 1025px) {
            .mobile-nav { display: none; }
        }
    </style>
</head>
<body>

    <div id="mobileSearchOverlay">
        <div class="m-search-box">
            <input type="text" id="mSearchInput" placeholder="Tìm tên phim...">
            <i class="fa-solid fa-circle-xmark close-search" onclick="toggleSearch(false)"></i>
        </div>
    </div>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo" onclick="location.href='index.html'">
                <i class="fa-solid fa-angles-right logo-arrow"></i>
                KITO <span>ANIME</span>
                <i class="fa-solid fa-angles-left logo-arrow"></i>
            </div>
            
            <div class="nav-right-side">
                <input type="text" class="pc-search-box" placeholder="Tìm kiếm...">
                <div id="userZoneDesktop"></div>
            </div>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="javascript:void(0)" onclick="toggleSearch(true)"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></a>
        <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử</span></a>
        <a href="javascript:void(0)" id="mobileUserBtn"><i class="fa-solid fa-user"></i><span>Cá nhân</span></a>
    </nav>

    <div class="user-modal-overlay" id="profileModal">
        <div class="profile-card">
            <span onclick="closeProfile()" style="position:absolute; top:15px; right:20px; cursor:pointer; font-size:24px; color:var(--gray)">&times;</span>
            <img src="" id="mAvatar" class="profile-avatar">
            <h2 id="mName" style="color:white">...</h2>
            <p id="mEmail" style="color:var(--gray); font-size:12px; margin-bottom:25px"></p>
            <button id="btnLogout" style="width:100%; background:var(--primary); color:white; border:none; padding:12px; border-radius:15px; font-weight:800; cursor:pointer;">ĐĂNG XUẤT</button>
        </div>
    </div>

    <main style="max-width:1400px; margin:80px auto 0; padding:20px;">
        <div style="background:#000; border-radius:20px; height:350px; position:relative; overflow:hidden; margin-bottom:30px; border:1px solid var(--border)">
            <div id="heroBg" style="position:absolute; inset:0; opacity:0.5"></div>
            <div style="position:relative; z-index:10; padding:40px; height:100%; display:flex; flex-direction:column; justify-content:center;">
                <h1 id="hTitle" style="font-size:32px; font-weight:900;">...</h1>
                <button id="hBtn" style="margin-top:20px; width:fit-content; background:var(--primary); color:white; border:none; padding:12px 30px; border-radius:10px; font-weight:800; cursor:pointer">XEM NGAY</button>
            </div>
        </div>

        <h2 class="section-title">Sắp phát hành</h2>
        <div class="anime-grid" id="comingGrid"></div>

        <h2 class="section-title">Mới cập nhật</h2>
        <div class="anime-grid" id="updateGrid"></div>

        <h2 class="section-title">Đề xuất</h2>
        <div class="anime-grid" id="recGrid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBP9ZnwzQrrRY5JNy1DANm3boaWgvhoS_w", authDomain: "kito-anime-vn.firebaseapp.com", projectId: "kito-anime-vn", storageBucket: "kito-anime-vn.firebasestorage.app", appId: "1:287480619398:web:f40d137345407f27874c07" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- MOBILE SEARCH ---
        window.toggleSearch = (show) => {
            const overlay = document.getElementById('mobileSearchOverlay');
            overlay.classList.toggle('active', show);
            if(show) document.getElementById('mSearchInput').focus();
        };

        // --- AUTH LOGIC ---
        onAuthStateChanged(auth, (user) => {
            const userZonePC = document.getElementById('userZoneDesktop');
            const mobileBtn = document.getElementById('mobileUserBtn');
            
            if (user) {
                const ava = user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email}`;
                // Desktop UI
                userZonePC.innerHTML = `<img src="${ava}" onclick="openProfile()" style="width:38px; height:38px; border-radius:50%; border:2px solid var(--primary); cursor:pointer; object-fit:cover;">`;
                // Modal Data
                document.getElementById('mAvatar').src = ava;
                document.getElementById('mName').innerText = user.displayName || "Thành viên Kito";
                document.getElementById('mEmail').innerText = user.email;
                // Mobile Click
                mobileBtn.onclick = () => openProfile();
            } else {
                userZonePC.innerHTML = `<button onclick="location.href='auth.html'" style="background:var(--primary); color:white; border:none; padding:8px 18px; border-radius:20px; font-weight:800; cursor:pointer">LOGIN</button>`;
                mobileBtn.onclick = () => location.href = 'auth.html';
            }
        });

        window.openProfile = () => document.getElementById('profileModal').classList.add('active');
        window.closeProfile = () => document.getElementById('profileModal').classList.remove('active');
        document.getElementById('btnLogout').onclick = () => signOut(auth).then(() => location.reload());

        // --- REALTIME FIRESTORE STATS ---
        async function getStats(id) {
            try {
                const snap = await getDoc(doc(db, "movie_stats", String(id)));
                if(snap.exists()) {
                    const data = snap.data();
                    const rating = data.rateCount > 0 ? (data.rating / data.rateCount).toFixed(1) : "0.0";
                    const views = data.views || 0;
                    if(document.getElementById(`rate-${id}`)) document.getElementById(`rate-${id}`).innerText = rating;
                    if(document.getElementById(`view-${id}`)) document.getElementById(`view-${id}`).innerText = views;
                }
            } catch(e) { console.error(e); }
        }

        // --- RENDER & LOAD ---
        async function init() {
            const res = await fetch('./api.json');
            const data = await res.json();
            
            renderList(data.comingSoon, 'comingGrid');
            renderList(data.updated, 'updateGrid');
            renderList(data.recommended, 'recGrid');

            // Hero setup
            const first = data.updated[0];
            document.getElementById('hTitle').innerText = first.title;
            document.getElementById('heroBg').style.backgroundImage = `url(${first.image_banner})`;
            document.getElementById('heroBg').style.backgroundSize = "cover";
            document.getElementById('hBtn').onclick = () => location.href = `watch.html?id=${first.id}`;
        }

        function renderList(list, gridId) {
            document.getElementById(gridId).innerHTML = list.map(m => {
                getStats(m.id); // Gọi lấy data từ Firebase
                return `
                <a href="watch.html?id=${m.id}" class="anime-card">
                    <div class="card-img">
                        <img src="${m.image}" alt="${m.title}" loading="lazy">
                        <div class="badge-rate"><i class="fa-solid fa-star"></i> <span id="rate-${m.id}">--</span></div>
                        <div class="badge-views"><i class="fa-solid fa-eye"></i> <span id="view-${m.id}">--</span></div>
                    </div>
                    <div style="padding:12px">
                        <h3 style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.title}</h3>
                    </div>
                </a>`;
            }).join('');
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Phim - KITO ANIME</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --dark: #0a0a0c;
            --card-bg: #16181d;
            --text: #ffffff;
            --gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 10, 12, 0.9);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--text); overflow-x: hidden; line-height: 1.6; }
        a { text-decoration: none !important; color: inherit; }

        /* --- NAVBAR (ĐỒNG BỘ INDEX) --- */
        .navbar { 
            background: var(--glass); height: 80px; display: flex; 
            align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .nav-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .logo span { color: var(--primary); }
        .nav-right-side { display: flex; align-items: center; gap: 20px; flex-grow: 1; justify-content: flex-end; }
        .nav-links ul { display: flex; gap: 5px; list-style: none; position: relative; }
        .nav-links a { font-weight: 700; font-size: 13px; color: var(--gray); text-transform: uppercase; padding: 10px 15px; position: relative; z-index: 2; transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .nav-links a:hover { color: #fff; }
        #underline { position: absolute; bottom: 0; height: 3px; background: var(--primary); border-radius: 10px; transition: var(--transition); pointer-events: none; z-index: 1; opacity: 0; }
        
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--glass); backdrop-filter: blur(20px); height: 65px; border-top: 1px solid var(--border); z-index: 1001; justify-content: space-around; align-items: center; }
        .mobile-nav a { display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 10px; font-weight: 700; gap: 4px; }
        .mobile-nav i { font-size: 20px; }

        /* --- LAYOUT XEM PHIM --- */
        .main-layout { max-width: 1400px; margin: 100px auto 50px; padding: 0 20px; display: grid; grid-template-columns: 1fr 350px; gap: 30px; }

        /* Khung phát & Thông tin */
        .player-section { width: 100%; }
        .video-wrapper { background: #000; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); aspect-ratio: 16/9; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        .info-card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-top: 25px; border: 1px solid var(--border); }
        .info-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .info-header h1 { font-size: 26px; font-weight: 900; color: var(--primary); }
        
        .meta-data { display: flex; gap: 20px; color: var(--gray); font-size: 14px; margin-bottom: 15px; }
        .meta-data span i { color: var(--primary); margin-right: 5px; }

        .description { font-size: 15px; color: #ccc; line-height: 1.8; border-top: 1px solid var(--border); padding-top: 20px; }

        /* Đánh giá */
        .rating-inline { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 12px; margin-top: 20px; }
        .stars { color: #444; font-size: 18px; cursor: pointer; }
        .stars i.active { color: #ffc107; }

        /* --- SIDEBAR ĐỀ XUẤT --- */
        .sidebar-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .sidebar-title::before { content: ''; width: 4px; height: 20px; background: var(--primary); border-radius: 10px; }
        
        .recommend-list { display: flex; flex-direction: column; gap: 15px; }
        .rec-item { display: flex; gap: 12px; background: var(--card-bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border); transition: 0.3s; }
        .rec-item:hover { border-color: var(--primary); transform: translateX(5px); }
        .rec-thumb { width: 90px; height: 120px; border-radius: 8px; object-fit: cover; }
        .rec-info h4 { font-size: 14px; font-weight: 700; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .rec-stats { font-size: 12px; color: var(--gray); }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; margin-top: 85px; padding-bottom: 80px; }
            .nav-links { display: none; }
            .mobile-nav { display: flex; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo" onclick="location.href='index.html'">KITO <span>ANIME</span></div>
            <div class="nav-right-side">
                <nav class="nav-links">
                    <ul id="tabList">
                        <li><a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i> Trang Chủ</a></li>
                        <li><a href="#" class="tab-item"><i class="fa-solid fa-layer-group"></i> Thể Loại</a></li>
                        <li><a href="#" class="tab-item"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử</a></li>
                        <div id="underline"></div>
                    </ul>
                </nav>
                <div id="userZone"></div>
            </div>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></a>
        <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử</span></a>
    </nav>

    <main class="main-layout">
        <div class="player-section">
            <div class="video-wrapper">
                <iframe id="mainPlayer" src="" allowfullscreen></iframe>
            </div>

            <div class="info-card">
                <div class="info-header">
                    <h1 id="movieTitle">Đang tải...</h1>
                </div>
                
                <div class="meta-data">
                    <span id="viewCount"><i class="fa-solid fa-eye"></i> 0 lượt xem</span>
                    <span id="ratingVal"><i class="fa-solid fa-star"></i> 0.0/10</span>
                </div>

                <div class="rating-inline">
                    <span style="font-size: 13px; font-weight: 700;">Đánh giá:</span>
                    <div class="stars" id="starGroup">
                        <i class="fa-solid fa-star" data-val="2"></i>
                        <i class="fa-solid fa-star" data-val="4"></i>
                        <i class="fa-solid fa-star" data-val="6"></i>
                        <i class="fa-solid fa-star" data-val="8"></i>
                        <i class="fa-solid fa-star" data-val="10"></i>
                    </div>
                </div>

                <div class="description" id="movieDesc">
                    Đang tải mô tả phim...
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <h3 class="sidebar-title">Có thể bạn thích</h3>
            <div class="recommend-list" id="sideRecs">
                </div>
        </aside>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP9ZnwzQrrRY5JNy1DANm3boaWgvhoS_w",
            authDomain: "kito-anime-vn.firebaseapp.com",
            projectId: "kito-anime-vn",
            storageBucket: "kito-anime-vn.firebasestorage.app",
            appId: "1:287480619398:web:f40d137345407f27874c07"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        // Khởi tạo và cập nhật Stats
        async function init() {
            if(!movieId) return;
            const docRef = doc(db, "movie_stats", movieId);
            
            try {
                // Tăng view
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    await setDoc(docRef, { views: 1, rating: 0, rateCount: 0 });
                } else {
                    await updateDoc(docRef, { views: increment(1) });
                }

                // Load API Data
                const res = await fetch('./api.json');
                const data = await res.json();
                const all = [...data.updated, ...data.comingSoon, ...data.recommended];
                const current = all.find(m => m.id === movieId);

                if(current) {
                    document.getElementById('movieTitle').innerText = current.title;
                    document.getElementById('movieDesc').innerText = current.description || "Phim chưa có mô tả chi tiết.";
                    document.title = "Đang xem: " + current.title;
                }

                // Render Sidebar (lấy ngẫu nhiên vài phim)
                const recs = all.filter(m => m.id !== movieId).sort(() => 0.5 - Math.random()).slice(0, 6);
                document.getElementById('sideRecs').innerHTML = recs.map(m => `
                    <a href="watch.html?id=${m.id}" class="rec-item">
                        <img src="${m.image}" class="rec-thumb">
                        <div class="rec-info">
                            <h4>${m.title}</h4>
                            <div class="rec-stats"><i class="fa-solid fa-play"></i> Xem ngay</div>
                        </div>
                    </a>
                `).join('');

                refreshStats();
            } catch (e) { console.error(e); }
        }

        async function refreshStats() {
            const docSnap = await getDoc(doc(db, "movie_stats", movieId));
            if(docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('viewCount').innerHTML = `<i class="fa-solid fa-eye"></i> ${data.views || 0} lượt xem`;
                const avg = data.rateCount > 0 ? (data.rating / data.rateCount).toFixed(1) : "0.0";
                document.getElementById('ratingVal').innerHTML = `<i class="fa-solid fa-star"></i> ${avg}/10`;
            }
        }

        // Logic đánh giá sao
        const stars = document.querySelectorAll('#starGroup i');
        stars.forEach(star => {
            star.onclick = async () => {
                const val = parseInt(star.getAttribute('data-val'));
                stars.forEach(s => s.classList.remove('active'));
                star.classList.add('active');
                let prev = star.previousElementSibling;
                while(prev) { prev.classList.add('active'); prev = prev.previousElementSibling; }

                try {
                    await updateDoc(doc(db, "movie_stats", movieId), {
                        rating: increment(val),
                        rateCount: increment(1)
                    });
                    refreshStats();
                } catch (e) { alert("Lỗi gửi đánh giá!"); }
            };
        });

        // Tabbar Underline
        const underline = document.getElementById('underline');
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.onmouseenter = () => {
                underline.style.opacity = "1";
                underline.style.width = `${tab.offsetWidth}px`;
                underline.style.left = `${tab.offsetLeft}px`;
            };
        });

        init();
    </script>
</body>
</html>

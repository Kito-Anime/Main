<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang xem Anime - KITO ANIME</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --dark: #0a0a0c;
            --card-bg: #16181d;
            --text: #ffffff;
            --gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 10, 12, 0.9);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--text); overflow-x: hidden; }
        a { text-decoration: none !important; color: inherit; }

        /* --- NAVBAR (GIỐNG INDEX) --- */
        .navbar { 
            background: var(--glass); height: 80px; display: flex; 
            align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .nav-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .logo span { color: var(--primary); }
        .nav-right-side { display: flex; align-items: center; gap: 20px; flex-grow: 1; justify-content: flex-end; }
        .nav-links ul { display: flex; gap: 5px; list-style: none; position: relative; }
        .nav-links a { font-weight: 700; font-size: 13px; color: var(--gray); text-transform: uppercase; padding: 10px 15px; position: relative; z-index: 2; transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .nav-links a:hover { color: #fff; }
        #underline { position: absolute; bottom: 0; height: 3px; background: var(--primary); border-radius: 10px; transition: var(--transition); pointer-events: none; z-index: 1; opacity: 0; }
        .user-profile { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 25px; border: 1px solid var(--border); cursor: pointer; }
        .avatar-img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }

        /* Mobile Nav */
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--glass); backdrop-filter: blur(20px); height: 65px; border-top: 1px solid var(--border); z-index: 1001; justify-content: space-around; align-items: center; }
        .mobile-nav a { display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 10px; font-weight: 700; gap: 4px; }
        .mobile-nav i { font-size: 20px; }

        /* --- PLAYER SECTION --- */
        .watch-container { max-width: 1200px; margin: 110px auto 50px; padding: 0 20px; }
        .video-player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .video-player iframe { width: 100%; height: 100%; border: none; }

        .movie-info { margin-top: 25px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
        .info-left h1 { font-size: 28px; font-weight: 800; color: var(--primary); }
        .stats-row { display: flex; gap: 20px; margin-top: 10px; color: var(--gray); font-size: 14px; }
        .stats-row span i { color: var(--primary); margin-right: 5px; }

        /* Rating System */
        .rating-box { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border); min-width: 250px; text-align: center; }
        .stars { display: flex; justify-content: center; gap: 8px; margin-top: 10px; font-size: 24px; color: #444; }
        .stars i { cursor: pointer; transition: 0.2s; }
        .stars i.active { color: #ffc107; }

        @media (max-width: 1024px) {
            .nav-links { display: none; }
            .mobile-nav { display: flex; }
            .watch-container { margin-top: 85px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo" onclick="location.href='index.html'">KITO <span>ANIME</span></div>
            <div class="nav-right-side">
                <nav class="nav-links">
                    <ul id="tabList">
                        <li><a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i> Trang Chủ</a></li>
                        <li><a href="#" class="tab-item"><i class="fa-solid fa-layer-group"></i> Thể Loại</a></li>
                        <li><a href="#" class="tab-item"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử</a></li>
                        <div id="underline"></div>
                    </ul>
                </nav>
                <div id="userZone"></div>
            </div>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></a>
        <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử</span></a>
    </nav>

    <main class="watch-container">
        <div class="video-player">
            <iframe id="mainPlayer" src="" allowfullscreen></iframe>
        </div>

        <div class="movie-info">
            <div class="info-left">
                <h1 id="movieTitle">Đang tải tên phim...</h1>
                <div class="stats-row">
                    <span id="viewCount"><i class="fa-solid fa-eye"></i> 0 lượt xem</span>
                    <span id="ratingVal"><i class="fa-solid fa-star"></i> 0.0/10</span>
                </div>
            </div>

            <div class="rating-box">
                <p style="font-weight: 700;">Đánh giá phim này</p>
                <div class="stars" id="starGroup">
                    <i class="fa-solid fa-star" data-val="2"></i>
                    <i class="fa-solid fa-star" data-val="4"></i>
                    <i class="fa-solid fa-star" data-val="6"></i>
                    <i class="fa-solid fa-star" data-val="8"></i>
                    <i class="fa-solid fa-star" data-val="10"></i>
                </div>
                <p id="rateStatus" style="font-size: 11px; color: var(--gray); margin-top: 8px;">Nhấn vào sao để gửi đánh giá</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP9ZnwzQrrRY5JNy1DANm3boaWgvhoS_w",
            authDomain: "kito-anime-vn.firebaseapp.com",
            projectId: "kito-anime-vn",
            storageBucket: "kito-anime-vn.firebasestorage.app",
            appId: "1:287480619398:web:f40d137345407f27874c07"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        // 1. CẬP NHẬT VIEW & LOAD THÔNG TIN
        async function initWatch() {
            if(!movieId) return;

            const docRef = doc(db, "movie_stats", movieId);
            
            try {
                const docSnap = await getDoc(docRef);
                
                // Nếu chưa có phim trong Firebase, tạo mới. Nếu có rồi thì tăng view
                if (!docSnap.exists()) {
                    await setDoc(docRef, { views: 1, rating: 0, rateCount: 0 });
                } else {
                    await updateDoc(docRef, { views: increment(1) });
                }

                // Lấy dữ liệu từ api.json để hiện tên
                const res = await fetch('./api.json');
                const data = await res.json();
                const allMovies = [...data.updated, ...data.comingSoon, ...data.recommended];
                const currentMovie = allMovies.find(m => m.id === movieId);

                if(currentMovie) {
                    document.getElementById('movieTitle').innerText = currentMovie.title;
                    document.title = "Đang xem: " + currentMovie.title;
                }

                // Cập nhật hiển thị View/Rate từ Firebase lên màn hình
                refreshStats();

            } catch (e) { console.error(e); }
        }

        async function refreshStats() {
            const docSnap = await getDoc(doc(db, "movie_stats", movieId));
            if(docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('viewCount').innerHTML = `<i class="fa-solid fa-eye"></i> ${data.views || 0} lượt xem`;
                const avg = data.rateCount > 0 ? (data.rating / data.rateCount).toFixed(1) : "0.0";
                document.getElementById('ratingVal').innerHTML = `<i class="fa-solid fa-star"></i> ${avg}/10`;
            }
        }

        // 2. HỆ THỐNG ĐÁNH GIÁ (RATING)
        const stars = document.querySelectorAll('#starGroup i');
        stars.forEach(star => {
            star.onclick = async () => {
                const val = parseInt(star.getAttribute('data-val'));
                
                // Cập nhật UI ngay lập tức
                stars.forEach(s => s.classList.remove('active'));
                star.classList.add('active');
                let prev = star.previousElementSibling;
                while(prev) { prev.classList.add('active'); prev = prev.previousElementSibling; }

                // Lưu vào Firebase
                try {
                    const docRef = doc(db, "movie_stats", movieId);
                    await updateDoc(docRef, {
                        rating: increment(val),
                        rateCount: increment(1)
                    });
                    document.getElementById('rateStatus').innerText = "Cảm ơn bạn đã đánh giá!";
                    refreshStats();
                } catch (e) { alert("Vui lòng thử lại sau!"); }
            };
        });

        // 3. TABBAR ANIMATION & AUTH (Đồng bộ index)
        const underline = document.getElementById('underline');
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.onmouseenter = () => {
                underline.style.opacity = "1";
                underline.style.width = `${tab.offsetWidth}px`;
                underline.style.left = `${tab.offsetLeft}px`;
            };
        });

        onAuthStateChanged(auth, (user) => {
            const userZone = document.getElementById('userZone');
            if (user) {
                userZone.innerHTML = `<div class="user-profile"><img src="${user.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed='+user.email}" class="avatar-img"></div>`;
            }
        });

        initWatch();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Anime - KITO ANIME</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --dark: #0a0a0c;
            --card-bg: #16181d;
            --text: #ffffff;
            --gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 10, 12, 0.9);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: var(--text); overflow-x: hidden; line-height: 1.6; padding-bottom: 80px; }
        a { text-decoration: none !important; color: inherit; }

        /* --- NAVBAR FIX (ĐỒNG BỘ INDEX) --- */
        .navbar { 
            background: var(--glass); height: 80px; display: flex; 
            align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .nav-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; cursor: pointer; min-width: 150px; }
        .logo span { color: var(--primary); }
        
        .nav-right-side { display: flex; align-items: center; gap: 20px; flex-grow: 1; justify-content: flex-end; }
        
        /* Tabbar Logic Fix */
        .nav-links ul { display: flex; gap: 5px; list-style: none; position: relative; padding: 10px 0; }
        .nav-links a { font-weight: 700; font-size: 13px; color: var(--gray); text-transform: uppercase; padding: 10px 15px; position: relative; z-index: 2; transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        
        #underline { position: absolute; bottom: 0; height: 3px; background: var(--primary); border-radius: 10px; transition: var(--transition); pointer-events: none; z-index: 1; opacity: 0; box-shadow: 0 0 10px var(--primary); }

        .search-box { background: rgba(255,255,255,0.07); border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; border: 1px solid var(--border); width: 180px; transition: 0.3s; }
        .search-box:focus-within { border-color: var(--primary); width: 240px; }
        .search-box input { background: none; border: none; color: white; padding-left: 10px; outline: none; font-size: 13px; width: 100%; }

        /* --- LAYOUT --- */
        .main-layout { max-width: 1400px; margin: 100px auto 30px; padding: 0 20px; display: grid; grid-template-columns: 1fr 380px; gap: 30px; }

        .video-wrapper { background: #000; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); aspect-ratio: 16/9; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        /* DANH SÁCH TẬP PHIM */
        .episodes-card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-top: 20px; border: 1px solid var(--border); }
        .ep-header { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
        .ep-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 14px; border: 1px solid var(--border); transition: 0.3s; cursor: pointer; }
        .ep-item:hover, .ep-item.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-3px); }

        .info-card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-top: 20px; border: 1px solid var(--border); }
        .info-header h1 { font-size: 26px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .meta-data { display: flex; gap: 20px; color: var(--gray); font-size: 14px; margin-bottom: 15px; }

        /* --- RATING --- */
        .stars { display: flex; gap: 5px; margin: 10px 0; }
        .stars i { cursor: pointer; color: #333; font-size: 18px; }
        .stars i.active { color: #ffc107; }

        /* --- SIDEBAR --- */
        .sidebar-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 12px; }
        .rec-item { display: flex; gap: 12px; background: var(--card-bg); padding: 10px; border-radius: 15px; border: 1px solid var(--border); transition: 0.3s; margin-bottom: 12px; }
        .rec-item:hover { border-color: var(--primary); }
        .rec-thumb { width: 80px; height: 110px; border-radius: 10px; object-fit: cover; }

        /* Mobile Nav */
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--glass); backdrop-filter: blur(25px); height: 65px; border-top: 1px solid var(--border); z-index: 1001; justify-content: space-around; align-items: center; }
        .mobile-nav a { display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 10px; font-weight: 700; gap: 4px; }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; margin-top: 85px; }
            .nav-links, .search-box { display: none; }
            .mobile-nav { display: flex; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo" onclick="location.href='index.html'">KITO <span>ANIME</span></div>
            <div class="nav-right-side">
                <nav class="nav-links">
                    <ul id="tabList">
                        <li><a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i> Trang Chủ</a></li>
                        <li><a href="#" class="tab-item"><i class="fa-solid fa-layer-group"></i> Thể Loại</a></li>
                        <li><a href="#" class="tab-item"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử</a></li>
                        <div id="underline"></div>
                    </ul>
                </nav>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color:var(--gray)"></i>
                    <input type="text" placeholder="Tìm kiếm...">
                </div>
                <div id="userZone"></div>
            </div>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></a>
        <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử</span></a>
    </nav>

    <main class="main-layout">
        <div class="player-section">
            <div class="video-wrapper">
                <iframe id="mainPlayer" src="https://symmetrical-adventure-4j7p5x9gvppqhqj4w-5500.app.github.dev/" allowfullscreen></iframe>
            </div>

            <div class="episodes-card">
                <div class="ep-header"><i class="fa-solid fa-list-ol"></i> Danh sách tập</div>
                <div class="ep-grid" id="episodeGrid">
                    <div class="ep-item active">1</div>
                    <div class="ep-item">2</div>
                    <div class="ep-item">3</div>
                    <div class="ep-item">4</div>
                    <div class="ep-item">5</div>
                    <div class="ep-item">6</div>
                    <div class="ep-item">7</div>
                    <div class="ep-item">8</div>
                    <div class="ep-item">9</div>
                    <div class="ep-item">10</div>
                    <div class="ep-item">11</div>
                    <div class="ep-item">12</div>
                </div>
            </div>

            <div class="info-card">
                <h1 id="movieTitle">Đang tải phim...</h1>
                <div class="meta-data">
                    <span id="viewCount"><i class="fa-solid fa-eye"></i> 0 views</span>
                    <span id="ratingVal"><i class="fa-solid fa-star"></i> 0.0/10</span>
                </div>
                <div class="stars" id="starGroup">
                    <i class="fa-solid fa-star" data-val="1"></i><i class="fa-solid fa-star" data-val="2"></i><i class="fa-solid fa-star" data-val="3"></i><i class="fa-solid fa-star" data-val="4"></i><i class="fa-solid fa-star" data-val="5"></i><i class="fa-solid fa-star" data-val="6"></i><i class="fa-solid fa-star" data-val="7"></i><i class="fa-solid fa-star" data-val="8"></i><i class="fa-solid fa-star" data-val="9"></i><i class="fa-solid fa-star" data-val="10"></i>
                </div>
                <div class="description" id="movieDesc">Đang load mô tả...</div>
            </div>
        </div>

        <aside class="sidebar">
            <h3 class="sidebar-title">Gợi ý khác</h3>
            <div id="sideRecs"></div>
        </aside>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP9ZnwzQrrRY5JNy1DANm3boaWgvhoS_w",
            authDomain: "kito-anime-vn.firebaseapp.com",
            projectId: "kito-anime-vn",
            storageBucket: "kito-anime-vn.firebasestorage.app",
            appId: "1:287480619398:web:f40d137345407f27874c07"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        async function init() {
            if(!movieId) return;
            try {
                // Load API
                const res = await fetch('./api.json');
                const data = await res.json();
                const all = [...data.updated, ...data.comingSoon, ...data.recommended];
                const movie = all.find(m => String(m.id) === String(movieId));

                if(movie) {
                    document.getElementById('movieTitle').innerText = movie.title;
                    document.getElementById('movieDesc').innerText = movie.description || "Nội dung đang cập nhật...";
                    
                    // Render Recs
                    const recs = all.filter(m => String(m.id) !== String(movieId)).sort(() => 0.5 - Math.random()).slice(0, 6);
                    document.getElementById('sideRecs').innerHTML = recs.map(m => `
                        <a href="watch.html?id=${m.id}" class="rec-item">
                            <img src="${m.image}" class="rec-thumb">
                            <div class="rec-info"><h4>${m.title}</h4><p style="font-size:11px;color:var(--gray)">Xem ngay</p></div>
                        </a>`).join('');
                }

                // Firebase Stats
                const docRef = doc(db, "movie_stats", String(movieId));
                const snap = await getDoc(docRef);
                if(!snap.exists()) await setDoc(docRef, { views: 1, rating: 0, rateCount: 0 });
                else await updateDoc(docRef, { views: increment(1) });
                
                refreshStats();
            } catch (e) { console.log(e); }
        }

        async function refreshStats() {
            const snap = await getDoc(doc(db, "movie_stats", String(movieId)));
            if(snap.exists()) {
                const d = snap.data();
                document.getElementById('viewCount').innerHTML = `<i class="fa-solid fa-eye"></i> ${d.views || 0} views`;
                const avg = d.rateCount > 0 ? (d.rating / d.rateCount).toFixed(1) : "0.0";
                document.getElementById('ratingVal').innerHTML = `<i class="fa-solid fa-star"></i> ${avg}/10`;
            }
        }

        // Tabbar Underline Fix
        const underline = document.getElementById('underline');
        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach(tab => {
            tab.addEventListener('mouseenter', () => {
                underline.style.opacity = "1";
                underline.style.width = `${tab.offsetWidth}px`;
                underline.style.left = `${tab.offsetLeft}px`;
            });
        });
        document.querySelector('.nav-links').addEventListener('mouseleave', () => { underline.style.opacity = "0"; });

        // Rating 10 sao
        document.querySelectorAll('#starGroup i').forEach(s => {
            s.onclick = async () => {
                const val = parseInt(s.dataset.val);
                await updateDoc(doc(db, "movie_stats", String(movieId)), { rating: increment(val), rateCount: increment(1) });
                refreshStats();
            }
        });

        init();
    </script>
</body>
</html>
